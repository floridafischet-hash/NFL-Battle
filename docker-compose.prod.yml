# Production overlay: Traefik terminates HTTPS with Let's Encrypt certificates.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires DOMAIN and ACME_EMAIL in .env and DNS pointing to this server (ports 80 + 443 open).

services:
  nginx:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.routers.nbb.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.nbb.entrypoints=websecure
      - traefik.http.routers.nbb.tls.certresolver=letsencrypt
      - traefik.http.routers.nbb.middlewares=nbb-hsts
      - traefik.http.middlewares.nbb-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.nbb-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.services.nbb.loadbalancer.server.port=80

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  letsencrypt:
