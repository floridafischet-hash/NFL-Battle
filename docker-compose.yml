# NFL Bracket Battle – complete stack.
#   cp .env.example .env && docker compose up -d      → http://localhost:8080
# Production with HTTPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: nfl-bracket-battle

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nfl}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-nfl}
  SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
  TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-30}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME}
  ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-CHANGE_ME}
  DATA_DIR: /data
  UPLOAD_DIR: /data/uploads
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
  AGENT_TRUSTED_DOMAINS: ${AGENT_TRUSTED_DOMAINS:-nfl.com,espn.com,cbssports.com,foxsports.com,apnews.com,reuters.com,pro-football-reference.com,sports.yahoo.com,nbcsports.com}
  AGENT_MIN_CONFIRMATIONS: ${AGENT_MIN_CONFIRMATIONS:-2}
  AGENT_RESULT_MIN_MINUTES_AFTER_KICKOFF: ${AGENT_RESULT_MIN_MINUTES_AFTER_KICKOFF:-60}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT-low}
  RESULT_AGENT_ENABLED: ${RESULT_AGENT_ENABLED:-true}
  RESULT_AGENT_TICK_SECONDS: ${RESULT_AGENT_TICK_SECONDS:-60}
  RESULT_AGENT_FIRST_CHECK_MINUTES: ${RESULT_AGENT_FIRST_CHECK_MINUTES:-200}
  RESULT_AGENT_RETRY_MINUTES: ${RESULT_AGENT_RETRY_MINUTES:-20}
  RESULT_AGENT_MAX_CALLS_PER_DAY: ${RESULT_AGENT_MAX_CALLS_PER_DAY:-40}
  REMINDER_HOURS_BEFORE_LOCK: ${REMINDER_HOURS_BEFORE_LOCK:-24}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfl}
      POSTGRES_USER: ${POSTGRES_USER:-nfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: database migrations + master/demo data (Kubernetes: Job / initContainer)
  migrate:
    build: ./backend
    image: nfl-bracket-battle/backend:latest
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *backend-env
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: nfl-bracket-battle/backend:latest
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: nfl-bracket-battle/frontend:latest
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  app-data:
